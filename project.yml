# XcodeGen spec for G2 Local.
# CI runs: brew install xcodegen && xcodegen generate && xcodebuild archive.
name: G2Local
packages:
  # Project-level declaration (required by XcodeGen). Target dependencies
  # reference this BY NAME, not by URL.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    version: 1.1.0
options:
  bundleIdPrefix: com.oaksthepomchi
  deploymentTarget:
    iOS: "16.0"
targets:
  G2Local:
    type: application
    platform: iOS
    sources:
      - path: G2Local
        excludes:
          # XcodeGen emits Info.plist itself (see info: below); including
          # it as a source file makes generation fail.
          - Info.plist
    info:
      path: G2Local/Info.plist
      properties:
        CFBundleDisplayName: G2 Local
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: >-
          G2 Local receives speech from the Even Hub page on this same phone
          over localhost. No network access is used.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oaksthepomchi.g2local
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Unsigned archive: Sideloadly re-signs the ipa locally.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      # Reference by the package name declared above (XcodeGen README pattern).
      - package: WhisperKit
schemes:
  G2Local:
    build:
      targets:
        G2Local: all
    archive:
      buildConfiguration: Release
