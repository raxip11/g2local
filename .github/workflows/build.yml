name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Weekly fresh build so the free-account 7-day expiry is never a blocker.
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Resolve SPM (WhisperKit)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project G2Local.xcodeproj \
            -scheme G2Local \
            -configuration Release

      - name: Archive (unsigned - Sideloadly re-signs)
        run: |
          mkdir -p build
          set +e
          xcodebuild archive \
            -project G2Local.xcodeproj \
            -scheme G2Local \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/G2Local \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild-archive.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Self-report: each compiler error becomes a GitHub annotation
            # (readable without auth), plus the last lines as one annotation.
            echo "::error::xcodebuild archive failed (exit $status) — compiler errors follow"
            grep -E "error:" build/xcodebuild-archive.log | sort -u | head -40 \
              | while IFS= read -r line; do
                  echo "::error::G2Local: $line"
                done || true
            echo "::error::tail: $(tail -8 build/xcodebuild-archive.log | tr '\n' ' | ')"
            tail -80 build/xcodebuild-archive.log || true
            exit 1
          fi

      # No -exportArchive: with CODE_SIGNING_ALLOWED=NO the export step
      # needs provisioning tricks we don't have. Zip the app ourselves -
      # Sideloadly re-signs the unsigned ipa anyway.
      - name: Package ipa
        run: |
          rm -rf export && mkdir -p export/Payload
          cp -R build/G2Local.xcarchive/Products/Applications/G2Local.app export/Payload/
          cd export
          ditto -c -k --sequesterRsrc --keepParent Payload ../G2Local.ipa
          ls -lh ../G2Local.ipa

      - name: Name artifact
        run: cp G2Local.ipa G2Local-v$(date +%Y%m%d)-$(git rev-parse --short HEAD).ipa

      - uses: actions/upload-artifact@v4
        with:
          name: G2Local-ipa
          path: G2Local-v*.ipa
          retention-days: 30

      # Server auto-deploy is intentionally NOT in this first version of
      # the pipeline. It will be added (gated on repo SSH secrets) after
      # the first green build, so we keep this file minimal + valid.
